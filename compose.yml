services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: family_medicine
      POSTGRES_USER: family_medicine
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in your shell or local .env}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - medicine_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_medicine -d family_medicine"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  medicine_data:
